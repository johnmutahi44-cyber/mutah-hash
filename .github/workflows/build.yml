name: Build Mutah Hash
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx --yes wrangler deploy --dry-run --config worker/wrangler.toml
