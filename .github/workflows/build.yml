name: Build Mutah Hash
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate Worker bundle
        run: npx --yes wrangler deploy --dry-run --config worker/wrangler.toml
      - name: Deploy Worker to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy --config worker/wrangler.toml
